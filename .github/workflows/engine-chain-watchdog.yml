# Engine release-chain watchdog (GH#1079).
#
# The App -> CLI auto-release chain (GH#539) never fired once. The App's
# dispatch workflow stopped starting on 2026-05-17 and nothing said so: a
# dispatch that is never sent leaves no failed run, no annotation, no trace.
# Eight App releases and three months later the only evidence was a CLI tag
# that had not appeared, and it took an unrelated investigation to notice.
#
# This job exists so that absence alerts instead of being inferred. It does
# not repair the chain -- the cause is in the App repo and the fix belongs
# there. It converts "nothing happened" into a failing, notified run.
#
# NOT wired into ci.yml on purpose: whenever the chain is down, a CI-level
# check would fail every unrelated pull request, and the first response to that
# is to route around it. A watchdog that gets disabled protects nothing. The
# pin floor at release time is the separate, deliberate gate (GH#1079 round 2).
#
# CAVEAT worth knowing: GitHub disables `schedule` triggers after 60 days with
# no repository activity. A silently disabled watchdog is the same disease it
# was written for, so `workflow_dispatch` is kept as the manual path and the
# script is runnable from a terminal:
#   GH_TOKEN=$(gh auth token --user skrptiq-prime) \
#     APP_CHECKOUT=../skrptiq-app scripts/engine-chain-check.sh
#
# It also answers GH#1084's "what CI step would have caught this": check 3
# compiles HEAD against .engine-pin, which ci.yml never does -- ci.yml builds
# against app main, and the pin is the revision releases actually ship.

name: Engine chain watchdog

concurrency:
  # GH#1099 — one run per ref. A superseded push cancelled the moment the next
  # arrives: re-pushing a branch three times paid for three full suites and only
  # the last one could still be merged.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  schedule:
    # DAILY (07:15 UTC). The question this answers is "has the chain broken again?", and that is
    # a daily question. The chain is delivering again as of 2026-11-27 11:47Z; the sender-side
    # cause is on GH#1086 (a release created under the default GITHUB_TOKEN raises no
    # workflow-triggering event). A break can reappear on any App release, and nothing else in
    # this repo would say so.
    #
    # The weekly era ran 2026-10-26 -> 2026-11-27 and was right for its own question: while the
    # repair was parked behind the Projects work, the answer was already known, so a daily run
    # re-measured a condition nobody was acting on and paid a failing run per day to do it. That
    # is the GH#1114 disease -- an alert whose cadence exceeds the rate at which anything can
    # change about it stops being read, and the run AFTER it stops being read is the one that
    # mattered. Cadence followed the question both times; neither era was a mute, and
    # `workflow_dispatch` answered on demand throughout.
    #
    # The restore deliberately did NOT happen when GH#1086 closed (2026-11-15 12:25Z): the chain
    # was not observed delivering until twelve days later, and a cron restored on the tracker's
    # date would have paid twelve days of reds for the GH#1296 outage -- the exact cost the weekly
    # cadence was adopted to avoid. The condition is "the chain is observed delivering", not "the
    # issue is closed" (GH#1310).
    #
    # IF A SCHEDULED RUN IS RED, DO NOT BLAME THE SCHEDULED PATH (GH#1310). Eleven scheduled reds
    # were once contrasted with one green `workflow_dispatch` to argue the trigger mattered:
    #
    #     The manual green and the scheduled reds differ by TIME, not by PATH.
    #     The dispatch was not privileged; it was later.
    #
    # That dispatch ran 58 minutes after the chain was repaired, and the dispatch path is 1-for-4
    # overall. A red here means the chain is broken, which is this job's entire purpose. Read the
    # emitted error, and stratify by that error rather than by which numbered CHECK line failed:
    # this script's output format has changed underneath us, so an absent `CHECK 1` line reads as
    # a failed check 1 and is not one.
    #
    # Scheduled runs land 5-12 hours after the nominal time. GitHub's delay is reliable in
    # delivery and unpunctual; absence across two windows is a finding, not a wait.
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      # Same org pipeline App as ci.yml and release.yml. No new credential:
      # the checks are reads of a sibling repo this App already grants.
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli,skrptiq-app

      - name: Checkout CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skrptiq-cli

      # fetch-depth: 0 — the engine/ diff is between an arbitrary pinned commit
      # and a release tag, so both history and tags have to be present. A
      # shallow checkout would make the pin unresolvable, and the script fails
      # closed rather than reporting a chain it could not see.
      - name: Checkout app (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skrptiq/skrptiq-app
          path: skrptiq-app
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Needed by check 3, which compiles this repo against the pinned engine
      # exactly as release.yml would. Same version source as ci.yml.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: skrptiq-cli/go.mod
          cache-dependency-path: skrptiq-cli/go.sum

      - name: Check the App -> CLI release chain is delivering
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_CHECKOUT: ${{ github.workspace }}/skrptiq-app
        run: skrptiq-cli/scripts/engine-chain-check.sh
