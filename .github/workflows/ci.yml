name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli,skrptiq-app

      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: skrptiq-cli

      - name: Checkout engine (app repo)
        uses: actions/checkout@v4
        with:
          repository: skrptiq/skrptiq-app
          path: skrptiq-app
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: skrptiq-cli/go.mod
          cache-dependency-path: skrptiq-cli/go.sum

      - name: Build
        working-directory: skrptiq-cli
        run: go build ./...

      - name: Test
        working-directory: skrptiq-cli
        run: go test ./...

      - name: Vet
        working-directory: skrptiq-cli
        run: go vet ./...
