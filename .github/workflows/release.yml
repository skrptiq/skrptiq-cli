name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: write

env:
  BINARY_NAME: skrptiq

jobs:
  # Auto-tag job — runs only on repository_dispatch.
  # Computes next patch version from the latest tag, creates + pushes it.
  # The new tag triggers a second run of this workflow via push:tags.
  auto-tag:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next patch version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.0.1"
          else
            # Strip 'v' prefix, split on '.', increment patch.
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Tagging $NEXT (previous: $LATEST)"
          git tag -a "$NEXT" -m "$NEXT — automated patch release (engine update)"
          git push origin "$NEXT"

  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            cross: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: skrptiq-cli

      - name: Checkout engine (app repo)
        uses: actions/checkout@v4
        with:
          repository: skrptiq/skrptiq-app
          path: skrptiq-app
          token: ${{ secrets.ENGINE_ACCESS_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: skrptiq-cli/go.mod
          cache-dependency-path: skrptiq-cli/go.sum

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.cross && matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: skrptiq-cli
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cross && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X github.com/skrptiq/skrptiq-cli/internal/version.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/skrptiq/skrptiq-cli/internal/version.Commit=${COMMIT}"
          LDFLAGS="${LDFLAGS} -X github.com/skrptiq/skrptiq-cli/internal/version.Date=${DATE}"
          go build -ldflags "${LDFLAGS}" -o ../dist/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} > ${{ env.BINARY_NAME }}-${{ matrix.suffix }}.sha256 2>/dev/null || \
          shasum -a 256 ${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} > ${{ env.BINARY_NAME }}-${{ matrix.suffix }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
