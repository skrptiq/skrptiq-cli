name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [engine-updated]

permissions:
  contents: write

env:
  BINARY_NAME: skrptiq

jobs:
  # Auto-tag job — runs only on repository_dispatch (App release -> engine-updated).
  # Pins the engine to the released SHA (client_payload.engine_sha), commits that
  # pin to main, then computes + pushes the next patch tag. The new tag triggers a
  # second run of this workflow via push:tags, which builds against the pinned SHA.
  auto-tag:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin engine to the released SHA
        env:
          ENGINE_SHA: ${{ github.event.client_payload.engine_sha }}
        run: |
          # Fail loud: the dispatch MUST carry a full 40-hex engine SHA. No SHA
          # -> no reproducible pin -> refuse to release (never fall back to HEAD).
          if [[ ! "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::engine-updated dispatch carried no valid engine_sha (got '${ENGINE_SHA}'). Cannot pin — aborting."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$ENGINE_SHA" > .engine-pin
          if git diff --quiet .engine-pin; then
            echo "Engine pin already at ${ENGINE_SHA:0:7} — no bump commit needed."
          else
            git add .engine-pin
            git commit -m "chore: pin engine to ${ENGINE_SHA:0:7} (App release ${{ github.event.client_payload.release_tag }})"
            git push origin HEAD:main
            echo "Pinned engine -> ${ENGINE_SHA} and pushed to main."
          fi

      - name: Compute next patch version and tag
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.0.1"
          else
            # Strip 'v' prefix, split on '.', increment patch.
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Tagging $NEXT (previous: $LATEST) at $(git rev-parse --short HEAD)"
          git tag -a "$NEXT" -m "$NEXT — automated patch release (engine update)"
          git push origin "$NEXT"

  # Verify the engine pin ONCE per tag build (cheap, authoritative) before the
  # per-arch matrix builds. Guards the "unpinned build" failure mode loudly.
  verify-pin:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      engine_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli,skrptiq-app

      - name: Checkout CLI (at the tag)
        uses: actions/checkout@v4

      - name: Read + validate engine pin
        id: pin
        run: |
          if [ ! -f .engine-pin ]; then
            echo "::error::.engine-pin is missing — the release build has no engine to pin to. Aborting."
            exit 1
          fi
          PIN=$(tr -d '[:space:]' < .engine-pin)
          if [[ ! "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.engine-pin is not a 40-hex commit SHA (got '${PIN}'). Aborting."
            exit 1
          fi
          echo "sha=$PIN" >> "$GITHUB_OUTPUT"
          echo "Engine pin: $PIN"

      - name: Assert pin is an ancestor of app main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PIN="${{ steps.pin.outputs.sha }}"
          # compare/<pin>...main == ahead (main ahead of pin) or identical => pin
          # is reachable from main. behind/diverged => pin is off-main; refuse.
          STATUS=$(gh api "repos/skrptiq/skrptiq-app/compare/${PIN}...main" --jq '.status')
          echo "compare ${PIN:0:7}...main => $STATUS"
          case "$STATUS" in
            ahead|identical) echo "Pin is reachable from app main — OK." ;;
            *) echo "::error::Engine pin ${PIN} is not an ancestor of app main (status=${STATUS}). Refusing to release an off-main engine."; exit 1 ;;
          esac

  build:
    needs: verify-pin
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            cross: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Generate pipeline app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          owner: skrptiq
          repositories: skrptiq-cli,skrptiq-app

      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: skrptiq-cli

      - name: Checkout engine (app repo) at the pinned SHA
        uses: actions/checkout@v4
        with:
          repository: skrptiq/skrptiq-app
          ref: ${{ needs.verify-pin.outputs.engine_sha }}
          path: skrptiq-app
          token: ${{ steps.app-token.outputs.token }}

      - name: Assert engine checkout matches the pin
        shell: bash
        run: |
          PIN="${{ needs.verify-pin.outputs.engine_sha }}"
          HEAD=$(git -C skrptiq-app rev-parse HEAD)
          if [ "$HEAD" != "$PIN" ]; then
            echo "::error::Engine checkout HEAD ($HEAD) != pinned SHA ($PIN). Aborting non-reproducible build."
            exit 1
          fi
          echo "Engine pinned + verified at $HEAD"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: skrptiq-cli/go.mod
          cache-dependency-path: skrptiq-cli/go.sum

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.cross && matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: skrptiq-cli
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cross && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-X github.com/skrptiq/skrptiq-cli/internal/version.Version=${VERSION}"
          LDFLAGS="${LDFLAGS} -X github.com/skrptiq/skrptiq-cli/internal/version.Commit=${COMMIT}"
          LDFLAGS="${LDFLAGS} -X github.com/skrptiq/skrptiq-cli/internal/version.Date=${DATE}"
          go build -ldflags "${LDFLAGS}" -o ../dist/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} > ${{ env.BINARY_NAME }}-${{ matrix.suffix }}.sha256 2>/dev/null || \
          shasum -a 256 ${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }} > ${{ env.BINARY_NAME }}-${{ matrix.suffix }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
